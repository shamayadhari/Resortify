# Local MongoDB for development:  docker compose up -d
# Then in backend/.env:  MONGODB_URI=mongodb://127.0.0.1:27017/resortify
services:
  mongo:
    image: mongo:7
    container_name: resortify-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - resortify-mongo-data:/data/db
volumes:
  resortify-mongo-data:
